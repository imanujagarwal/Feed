# Generated by `npx crashheal init`.
# Triggered by the Firebase alert function (crashheal-functions/), by hand, or by the daily backlog sweep.
name: Crashheal

on:
  repository_dispatch:
    types: [crashlytics-issue]
  workflow_dispatch:
    inputs:
      issue_id:
        description: "Crashlytics issue ID (leave blank to pick from the top open issues)"
        required: false
      app_id:
        description: "Firebase app ID (optional, defaults to the first app in .crashheal.yml)"
        required: false
  schedule:
    - cron: "23 21 * * *" # daily backlog sweep

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: crashheal-${{ github.event.client_payload.issueId || inputs.issue_id || github.run_id }}
  cancel-in-progress: false

jobs:
  heal:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: imanujagarwal/crashheal@v0
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          firebase-service-account: ${{ secrets.CRASHHEAL_FIREBASE_SA }}
          # PRs opened with the default GITHUB_TOKEN don't trigger your CI. Use a GitHub App or fine-grained PAT if you want them to.
          github-token: ${{ secrets.CRASHHEAL_GITHUB_TOKEN || github.token }}
          issue-id: ${{ github.event.client_payload.issueId || inputs.issue_id }}
          issue-type: ${{ github.event.client_payload.type }}
          app-id: ${{ github.event.client_payload.appId || inputs.app_id }}
        # env:
        #   CRASHHEAL_TEST_USER: ${{ secrets.CRASHHEAL_TEST_USER }}
        #   CRASHHEAL_TEST_PASSWORD: ${{ secrets.CRASHHEAL_TEST_PASSWORD }}
